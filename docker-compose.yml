services:
  backend:
    build: ./backend
    container_name: tft-backend
    expose:
      - "8080" # Internal only

  frontend:
    build: ./frontend
    container_name: tft-frontend
    expose:
      - "80" # Internal only

  nginx:
    image: nginx:alpine
    container_name: tft-nginx
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

