# Minimal nginx config for ACME challenge only (SSL bootstrap)
# Used during initial certificate generation before the app is running

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else - show setup message
        location / {
            return 200 'TFT Server - Setting up SSL certificate...\n';
            add_header Content-Type text/plain;
        }
    }
}
