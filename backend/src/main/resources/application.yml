spring:
  application:
    name: tft-backend
  datasource:
    url: "jdbc:sqlite:data/analytics.db?foreign_keys=on&journal_mode=WAL&synchronous=FULL&busy_timeout=5000"
    hikari:
      maximum-pool-size: 1

server:
  port: 8080
  forward-headers-strategy: framework

app:
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Local development default. Production overrides this in application-prod.yml.
analytics:
  admin:
    password: ${ANALYTICS_ADMIN_PASSWORD:}
